name: 機能・改善の提案
description: 使う場面と解決したい問題を伝える
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: どのような場面で困っているか、個人情報を含めずに教えてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
      description: 今の操作から、どのように変わると使いやすくなるかを記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 現在の対処方法・補足
